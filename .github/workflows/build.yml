name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f buyingchunks_fabric_clean/build.gradle ]; then
            echo "dir=buyingchunks_fabric_clean" >> "$GITHUB_OUTPUT"
          else
            echo "No build.gradle found"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew clean build --stacktrace

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buying-chunks-fabric-build
          path: |
            build/libs/*.jar
            buyingchunks_fabric_clean/build/libs/*.jar
          if-no-files-found: ignore
