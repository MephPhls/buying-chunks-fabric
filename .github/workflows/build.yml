name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Reconstruct source
        shell: bash
        run: |
          cat xzparts/x00.b64 xzparts/x01.b64 xzparts/x02.b64 xzparts/x03.b64 xzparts/x04.b64 xzparts/x05.b64 xzparts/x06.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz
          rm source.tar.xz
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          echo "Project reconstructed:"
          find src/main/java -type f | wc -l

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buying-chunks-fabric-build
          path: build/libs/*.jar
          if-no-files-found: ignore
