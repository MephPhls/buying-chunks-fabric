name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source
        shell: bash
        run: |
          cat xzparts/x00.b64 xzparts/x01.b64 xzparts/x02.b64 xzparts/x03.b64 xzparts/x04.b64 xzparts/x05.b64 xzparts/x06.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz
          rm source.tar.xz
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          echo "Project reconstructed:"
          find src/main/java -type f | wc -l

      - name: Apply port2 right-click overrides
        shell: bash
        run: |
          cat feature-port2/p2_00.b64 feature-port2/p2_01.b64 | base64 -d > port2-overrides.tar.xz
          echo "7506e84330acde503c7204726dca3a4a8a274f4c6becaac8031ac1627c7ca455  port2-overrides.tar.xz" | sha256sum -c -
          tar -xJf port2-overrides.tar.xz
          rm port2-overrides.tar.xz
          grep -n "mod_version" gradle.properties
          test -f src/main/java/snoopypupser/buyingchunks/client/ChunkManageScreen.java
          test -f src/main/java/snoopypupser/buyingchunks/network/UnclaimChunkPacket.java
          grep -n "ChunkButtonManageMixin" src/main/resources/buyingchunks.mixins.json

      - name: Add missing dependency repositories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          needle = '    mavenCentral()\n'
          replacement = "    mavenCentral()\n    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }\n    maven { name = 'Siphalor'; url = 'https://maven.siphalor.de/' }\n"
          if 'maven.blamejared.com' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          grep -n "BlameJared\|Siphalor" build.gradle

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buying-chunks-fabric-build-port2
          path: build/libs/*.jar
          if-no-files-found: ignore
