name: Build Fabric Mod

on:
  push:
    branches: [ main, port4.1-admin-team-settings ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source
        shell: bash
        run: |
          cat xzparts/x00.b64 xzparts/x01.b64 xzparts/x02.b64 xzparts/x03.b64 xzparts/x04.b64 xzparts/x05.b64 xzparts/x06.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz
          rm source.tar.xz
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          echo "Project reconstructed:"
          find src/main/java -type f | wc -l

      - name: Apply Port3.1 hotfix overrides
        shell: bash
        run: |
          cp -f overrides/src/main/java/snoopypupser/buyingchunks/mixin/GuiMixin.java src/main/java/snoopypupser/buyingchunks/mixin/GuiMixin.java
          cp -f overrides/src/main/java/snoopypupser/buyingchunks/mixin/MouseHandlerMixin.java src/main/java/snoopypupser/buyingchunks/mixin/MouseHandlerMixin.java
          grep -n "method_1753\|method_1601" src/main/java/snoopypupser/buyingchunks/mixin/GuiMixin.java src/main/java/snoopypupser/buyingchunks/mixin/MouseHandlerMixin.java

      - name: Apply Port4 overrides
        shell: bash
        run: |
          echo "Port4 part hashes:"
          sha256sum port4parts/p00.b64 port4parts/p01.b64 port4parts/p02_0.b64 port4parts/p02_1.b64
          cat port4parts/p00.b64 port4parts/p01.b64 port4parts/p02_0.b64 port4parts/p02_1.b64 | base64 -d > port4-overrides.tar.xz
          echo "Decoded Port4 archive hash:"
          sha256sum port4-overrides.tar.xz
          xz -t port4-overrides.tar.xz
          tar -xJf port4-overrides.tar.xz
          rm port4-overrides.tar.xz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle.properties')
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if line.startswith('mod_version='):
                  line = 'mod_version=1.2.0-fabric-port4.1'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          grep -n "mod_version" gradle.properties
          grep -n "RequestClaimShopSyncPacket" src/main/java/snoopypupser/buyingchunks/network/BuyingChunksNetwork.java
          if grep -q "SpawnProtectionHandler.register" src/main/java/snoopypupser/buyingchunks/BuyingChunks.java; then
            echo "Spawn protection is still registered"
            exit 1
          fi

      - name: Apply Port4.1 admin team settings fix
        shell: bash
        run: |
          python3 overrides/patch_admin_team_settings.py
          grep -n "pendingBoolValues\|pendingPrivacyValues\|block_edit_and_interact_mode" src/main/java/snoopypupser/buyingchunks/client/AdminServerTeamDetailScreen.java

      - name: Add missing dependency repositories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          needle = '    mavenCentral()\n'
          replacement = "    mavenCentral()\n    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }\n    maven { name = 'Siphalor'; url = 'https://maven.siphalor.de/' }\n"
          if 'maven.blamejared.com' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          grep -n "BlameJared\|Siphalor" build.gradle

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buying-chunks-fabric-build
          path: build/libs/*.jar
          if-no-files-found: ignore
